name: Bug report
description: Report a reproducible implementation, contract, or documentation problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, cookies, personal data, production traces, or other secrets. See SECURITY.md for sensitive reports.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Exact commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS/architecture, Node/Python/browser, active protocol, framework if relevant
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      description: Include the exact command and a sanitized configuration summary.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
