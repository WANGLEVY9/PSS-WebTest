name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check documentation and active-design consistency
        run: node scripts/check-docs.mjs
      - name: Check restricted publication paths
        run: ./scripts/check-public-boundary.sh

  offline-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium for local browser checks
        run: npx playwright install --with-deps chromium
      - name: Run source-only offline verification
        run: |
          mkdir -p artifacts/local-runtime
          npm run sponsor:verify:portable -- --python python3 --output artifacts/local-runtime/ci-offline
      - name: Validate legacy manifests and shared study assets
        run: |
          npm run validate:manifests
          npm run validate:configuration-registry
          npm run validate:study-assets
      # No model/provider secrets, live official benchmark tasks or raw-ledger upload.
      # Artifact-dependent legacy tests remain explicitly not-run in the report.
