services:
  web:
    image: jykoh/classifieds:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:9980:9980"
    depends_on:
      - db
    environment:
      CLASSIFIEDS: http://127.0.0.1:9980/
      RESET_TOKEN: ${PSS_VWA_CLASSIFIEDS_RESET_TOKEN:?local reset token required}
  db:
    image: mysql:8.1
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${PSS_VWA_DB_PASSWORD:?local database password required}
      MYSQL_DATABASE: osclass
    volumes:
      - ../artifacts/benchmark-snapshots/visualwebarena/environment_docker/classifieds_docker_compose/mysql:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
volumes:
  db_data: {}
